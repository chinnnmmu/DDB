<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDB 後台管理</title>
<style>
:root{
  --bg:#F8F6F3;--card:#FFFFFF;--card2:#F2EDE8;--border:#E8E0D8;--border2:#D8CEC4;
  --text:#3A3330;--text2:#7A6E68;--text3:#A89890;
  --rose:#d4788a;--rose-light:#fce8ec;--sage:#6a9478;--sage-light:#e0f0e8;
  --sky:#6a8ea8;--sky-light:#daeef8;--peach:#d8906a;--peach-light:#f5ebe0;
  --gold:#b89470;--gold-light:#f5ede0;--accent:#b89470;
  --font:'Noto Sans TC',system-ui,sans-serif;--mono:'DM Mono',monospace;
  --sidebar-w:220px;
}
body.dark-theme{
  --bg:#26221f;--card:#312c28;--card2:#3a342f;--border:#4a433d;--border2:#5c544c;
  --text:#f2ebe1;--text2:#bfb2a3;--text3:#8c8175;--rose:#e6b3ba;--rose-light:#453235;
  --sage:#a1c2a8;--sage-light:#304035;--sky:#a1b8d6;--sky-light:#2c384a;
  --peach:#e8bd9b;--peach-light:#4a382b;--gold:#d4b882;--gold-light:#423826;--accent:#d4b882;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;}

/* ── sidebar ── */
.sidebar{display:none;position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:var(--card);border-right:1px solid var(--border);
  flex-direction:column;padding:24px 16px;z-index:100;}
.sidebar-logo{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-bottom:8px;}
.sidebar-sub{font-size:10px;color:var(--text3);letter-spacing:.08em;margin-bottom:28px;}
.snav-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;
  color:var(--text2);font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer;
  transition:.18s;text-align:left;font-family:var(--font);}
.snav-item.active{color:var(--gold);font-weight:600;background:var(--gold-light);}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;}
.theme-btns{display:flex;gap:4px;margin-bottom:12px;}
.theme-btns button{flex:1;padding:5px 0;font-size:14px;border:1px solid var(--border2);
  background:var(--card2);border-radius:6px;cursor:pointer;transition:.18s;}
.theme-btns button.active{background:var(--gold);border-color:var(--gold);}
.sync-badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:10px;
  background:var(--sage-light);color:var(--sage);border:1px solid var(--sage);}

/* ── top-nav (mobile) ── */
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.top-nav-title{font-size:14px;font-weight:700;color:var(--gold);}

/* ── bottom-nav (mobile) ── */
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;
  font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;gap:2px;}
.bnav-item.active{color:var(--gold);}

/* ── main ── */
.main{padding:16px;padding-bottom:80px;}

/* ── panels ── */
.panel{display:none;}
.panel.active{display:block;}

/* ── desktop grid ── */
.desk-grid{display:block;}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.card-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;letter-spacing:.05em;text-transform:uppercase;}
textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;font-size:13px;color:var(--text);font-family:var(--mono);resize:vertical;outline:none;}
textarea:focus{border-color:var(--gold);}
input[type=text],input[type=date]{background:var(--card2);border:1px solid var(--border);
  border-radius:6px;padding:6px 9px;font-size:13px;color:var(--text);outline:none;}
input:focus{border-color:var(--gold);}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px;
  font-family:var(--font);transition:.18s;}
.btn-gold{background:var(--gold);color:#fff;font-weight:600;}
.btn-gold:hover{opacity:.88;}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm{padding:5px 10px;font-size:12px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.status{font-size:11px;color:var(--text3);margin-top:6px;}

/* output areas */
.out-area{background:var(--card2);border:1px solid var(--border);border-radius:8px;
  padding:10px;font-size:12px;font-family:var(--mono);white-space:pre-wrap;
  min-height:50px;max-height:280px;overflow-y:auto;color:var(--text);}

/* fmt */
.fmt-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
.fmt-tab{padding:5px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--card2);color:var(--text2);font-size:12px;cursor:pointer;}
.fmt-tab.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.field-item label{display:block;font-size:11px;color:var(--text3);margin-bottom:3px;}
.field-item input{width:100%;}
.adv-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;
  color:var(--text3);padding:5px 0;user-select:none;}
.adv-body{display:none;padding-top:8px;}
.adv-body.open{display:block;}
.fmt-out-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;}

/* patch modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--card);border-radius:14px;padding:20px;width:min(460px,92vw);}

/* toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);
  background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;
  opacity:0;transition:.3s;pointer-events:none;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── desktop overrides ── */
@media(min-width:1024px){
  .sidebar{display:flex;}
  .bottom-nav{display:none;}
  .top-nav{display:none;}
  .main{margin-left:var(--sidebar-w);padding:20px 28px;padding-bottom:20px;}
  .desk-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .desk-col-full{grid-column:1/-1;}
  .fmt-out-grid{grid-template-columns:1fr 1fr;}
  .week-grid{grid-template-columns:repeat(7,1fr);}
  #toast{bottom:24px;}
}
@media(max-width:600px){
  .field-grid,.fmt-out-grid{grid-template-columns:1fr;}
  .week-grid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
<body>

<!-- 側邊欄（桌機） -->
<aside class="sidebar">
  <div class="sidebar-logo">✦ DDB | ADMIN</div>
  <div class="sidebar-sub">後台管理系統</div>
  <button class="snav-item active" onclick="AT('sched')">📅 班表母檔</button>
  <button class="snav-item" onclick="AT('format')">✨ 轉檔器</button>
  <div class="sidebar-footer">
    <div id="syncBadge" class="sync-badge" style="margin-bottom:10px;">同步中…</div>
    <div id="themeToggle" class="theme-btns">
      <button onclick="setTheme('default')" class="active" title="預設">🌞</button>
      <button onclick="setTheme('dark-theme')" title="深色">🌙</button>
    </div>
  </div>
</aside>

<!-- 頂部欄（手機） -->
<div class="top-nav">
  <div class="top-nav-title">✦ DDB 後台</div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span id="syncBadgeMobile" class="sync-badge" style="font-size:10px;">…</span>
    <button onclick="setTheme('dark-theme')" style="background:none;border:none;font-size:16px;cursor:pointer;">🌙</button>
    <button onclick="setTheme('default')" style="background:none;border:none;font-size:16px;cursor:pointer;">🌞</button>
  </div>
</div>

<!-- 主內容 -->
<div class="main">

  <!-- 班表母檔 -->
  <div id="panel-sched" class="panel active">

    <div class="desk-grid">
      <!-- 左欄：母檔 -->
      <div>
        <div class="card">
          <div class="card-title">母檔資料庫</div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:6px;">格式：🤍牌價 『姓名』</div>
          <textarea id="db" rows="18" placeholder="貼上母檔資料庫…" oninput="debounceSave()"></textarea>
          <div class="row" style="margin-top:8px;">
            <button class="btn-gold" onclick="sortDB()">↕ 排序去重</button>
            <button class="btn-outline" onclick="openPatchModal()">🔄 覆蓋更新</button>
            <button class="btn-outline btn-sm" onclick="exportDB()">💾 匯出</button>
          </div>
          <div id="dbStatus" class="status"></div>
        </div>
      </div>

      <!-- 右欄：當日轉換 + 週報 -->
      <div>
        <div class="card">
          <div class="card-title">當日轉換</div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:6px;">格式：牌價 姓名 時間-時間</div>
          <textarea id="inputA" rows="6" placeholder="2000 姓名 1300-1700" oninput="saveLS('sch-input-day',this.value)"></textarea>
          <div class="row" style="margin-top:8px;">
            <button class="btn-gold" onclick="convertDay()">▶ 轉換</button>
            <button class="btn-outline btn-sm" onclick="sortDayInput()">↕ 排序</button>
            <button class="btn-outline btn-sm" onclick="clearDayInput()">✕ 清除</button>
            <button class="btn-outline btn-sm" onclick="copyOutput()">📋 複製</button>
          </div>
          <div id="outputDiv" class="out-area" style="margin-top:8px;"></div>
          <div id="missing" class="status" style="color:var(--rose);"></div>
        </div>

        <div class="card">
          <div class="card-title">週報彙整</div>
          <textarea id="weekInput" rows="7" placeholder="貼上週報原文…" oninput="saveLS('sch-input-week',this.value)"></textarea>
          <div class="row" style="margin-top:8px;">
            <button class="btn-gold" onclick="convertWeek()">▶ 彙整</button>
            <button class="btn-outline btn-sm" onclick="sortWeekInput()">↕ 排序</button>
            <button class="btn-outline btn-sm" onclick="clearWeekInput()">✕ 清除</button>
            <button class="btn-outline btn-sm" onclick="copyPure()">📋 複製乾淨名單</button>
          </div>
          <div id="pureOutput" class="out-area" style="margin-top:8px;"></div>
        </div>
      </div>

      <!-- 週看板（全寬） -->
      <div class="desk-col-full">
        <div class="card">
          <div class="card-title">週看板</div>
          <div id="weekGrid" class="week-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 轉檔器 -->
  <div id="panel-format" class="panel">
    <div class="desk-grid">
      <!-- 左欄：輸入 -->
      <div>
        <div class="card">
          <div class="card-title">轉檔輸入</div>
          <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">
            <input type="date" id="fmtDatePicker" onchange="fmtOnDateChange()">
            <span id="fmtWeekday" style="font-size:13px;color:var(--text3);"></span>
          </div>
          <textarea id="fmtInputText" rows="10" placeholder="貼上原始名單文案…"></textarea>
          <div style="margin-top:10px;">
            <div class="card-title" style="margin-bottom:6px;">快速異動</div>
            <textarea id="fmtQuickRest" rows="2" placeholder="休息異動文字…" style="margin-bottom:6px;" oninput="saveLS('fmt-quickRest',this.value)"></textarea>
            <textarea id="fmtQuickFull" rows="2" placeholder="完整異動文字…" oninput="saveLS('fmt-quickFull',this.value)"></textarea>
          </div>
          <div class="row" style="margin-top:10px;">
            <button class="btn-gold" onclick="fmtProcessAll()">✦ 四款轉檔</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">款式設定</div>
          <div class="fmt-tabs" id="fmtTabRow"></div>
          <div style="margin-bottom:8px;">
            <label style="font-size:11px;color:var(--text3);">款式名稱</label>
            <input type="text" id="fmtTabNameCur" style="width:160px;margin-top:3px;" oninput="fmtPresets[fmtCurrentPreset].name=this.value;fmtRefreshTabs();">
          </div>
          <div class="adv-toggle" onclick="fmtToggleAdv()">
            <span id="fmtAdvArrow">▶</span> 進階符號設定
          </div>
          <div class="adv-body" id="fmtAdvBody">
            <div class="field-grid" id="fmtFieldGrid"></div>
          </div>
          <div class="row" style="margin-top:12px;">
            <button class="btn-gold" onclick="fmtSavePresets()">💾 儲存設定</button>
            <button class="btn-outline btn-sm" onclick="fmtResetAll()">↺ 還原預設</button>
          </div>
        </div>
      </div>

      <!-- 右欄：輸出 -->
      <div>
        <div class="card">
          <div class="card-title">轉檔結果</div>
          <div id="fmtOutputArea" class="fmt-out-grid"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 底部導覽（手機） -->
<nav class="bottom-nav">
  <button class="bnav-item active" onclick="AT('sched')"><span>📅</span>班表母檔</button>
  <button class="bnav-item" onclick="AT('format')"><span>✨</span>轉檔器</button>
</nav>

<!-- 覆蓋更新 Modal -->
<div class="modal-bg" id="patchModal" onclick="if(event.target===this)closePatchModal()">
  <div class="modal-box">
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">🔄 覆蓋更新</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">貼入要新增或覆蓋的人員資料。</div>
    <textarea id="dbPatch" rows="8" placeholder="貼入資料…"></textarea>
    <div id="patchResult" style="font-size:12px;color:var(--rose);margin-top:6px;"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px;">
      <button class="btn-outline" onclick="closePatchModal()">取消</button>
      <button class="btn-gold" onclick="patchDB()">✓ 確定覆蓋</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ==================== 主題 ====================
function setTheme(t){
  try{
    document.body.classList.remove('dark-theme');
    if(t!=='default') document.body.classList.add(t);
    localStorage.setItem('ddb-admin-theme',t);
    document.querySelectorAll('#themeToggle button').forEach(function(b,i){
      b.classList.toggle('active',['default','dark-theme'][i]===t);
    });
  }catch(e){}
}

// ==================== Tab =====================
function AT(id){
  ['sched','format'].forEach(function(t,i){
    document.getElementById('panel-'+t).classList.toggle('active',t===id);
    document.querySelectorAll('.snav-item')[i].classList.toggle('active',t===id);
    document.querySelectorAll('.bnav-item')[i].classList.toggle('active',t===id);
  });
  if(id==='format') fmtInit();
}

// ==================== Toast ====================
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='show';
  setTimeout(function(){el.className='';},2400);
}

// ==================== localStorage ============
function loadLS(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function saveLS(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// ==================== Sync Badge ==============
function setSyncBadge(state,msg){
  ['syncBadge','syncBadgeMobile'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    el.textContent=msg;
    var map={ok:'var(--sage)',err:'var(--rose)',syncing:'var(--gold)'};
    var mapBg={ok:'var(--sage-light)',err:'var(--rose-light)',syncing:'var(--gold-light)'};
    el.style.color=map[state]||'var(--text3)';
    el.style.background=mapBg[state]||'var(--card2)';
    el.style.borderColor=map[state]||'var(--border)';
  });
}

// ==================== Cloud ===================
var syncTimer=null;
function debounceSave(){clearTimeout(syncTimer);syncTimer=setTimeout(saveAdminToCloud,1200);}

function saveAdminToCloud(){
  if(typeof google==='undefined'||!google.script||!google.script.run){setSyncBadge('err','本機模式');return;}
  setSyncBadge('syncing','儲存中…');
  var payload={
    schDB: document.getElementById('db').value||'',
    formatPresets: JSON.parse(JSON.stringify(fmtPresets||[]))
  };
  google.script.run
    .withSuccessHandler(function(r){setSyncBadge(r&&r.success?'ok':'err',r&&r.success?'已同步':'儲存失敗');})
    .withFailureHandler(function(){setSyncBadge('err','儲存失敗');})
    .saveAdminData(payload);
}

function loadAdminFromCloud(){
  if(typeof google==='undefined'||!google.script||!google.script.run){setSyncBadge('ok','本機模式');restoreLocal();return;}
  setSyncBadge('syncing','載入中…');
  google.script.run
    .withSuccessHandler(function(r){
      try{
        if(r&&r.schDB) document.getElementById('db').value=r.schDB;
        if(r&&r.formatPresets&&r.formatPresets.length) fmtPresets=r.formatPresets;
      }catch(e){}
      setSyncBadge('ok','已同步'); restoreLocal();
    })
    .withFailureHandler(function(){setSyncBadge('err','載入失敗');restoreLocal();})
    .loadAdminData();
}

function restoreLocal(){
  var d=loadLS('sch-input-day');if(d&&document.getElementById('inputA')) document.getElementById('inputA').value=d;
  var w=loadLS('sch-input-week');if(w&&document.getElementById('weekInput')) document.getElementById('weekInput').value=w;
  var qr=loadLS('fmt-quickRest');if(qr&&document.getElementById('fmtQuickRest')) document.getElementById('fmtQuickRest').value=qr;
  var qf=loadLS('fmt-quickFull');if(qf&&document.getElementById('fmtQuickFull')) document.getElementById('fmtQuickFull').value=qf;
}

// ==================== 班表母檔 ================
function parseToMap(raw){
  var map=new Map(); if(!raw) return map;
  raw.split(/\n\s*\n/).forEach(function(block){
    var b=block.trim(); if(!b) return;
    var nm=b.match(/『([^』]+)』/),pm=b.match(/🤍(\d+)/);
    if(nm&&pm) map.set(nm[1].trim(),{price:parseInt(pm[1],10),content:b});
  });
  return map;
}

function sortDB(){
  var raw=document.getElementById('db').value.trim(); if(!raw){toast('資料庫是空的');return;}
  var arr=Array.from(parseToMap(raw).values()).sort(function(a,b){return b.price-a.price;});
  document.getElementById('db').value=arr.map(function(x){return x.content;}).join('\n\n');
  document.getElementById('dbStatus').textContent='✓ 去重 + 降序（共 '+arr.length+' 筆）';
  debounceSave();
}

function openPatchModal(){document.getElementById('dbPatch').value='';document.getElementById('patchResult').textContent='';document.getElementById('patchModal').classList.add('open');}
function closePatchModal(){document.getElementById('patchModal').classList.remove('open');}

function patchDB(){
  var patchRaw=document.getElementById('dbPatch').value.trim();
  if(!patchRaw){document.getElementById('patchResult').textContent='⚠️ 請先貼入資料';return;}
  var existMap=parseToMap(document.getElementById('db').value.trim());
  var patchMap=parseToMap(patchRaw);
  if(!patchMap.size){document.getElementById('patchResult').textContent='⚠️ 找不到有效格式';return;}
  var ow=0,add=0;
  patchMap.forEach(function(v,n){if(existMap.has(n))ow++;else add++;existMap.set(n,v);});
  document.getElementById('db').value=Array.from(existMap.values()).sort(function(a,b){return b.price-a.price;}).map(function(x){return x.content;}).join('\n\n');
  closePatchModal();
  document.getElementById('dbStatus').textContent='✓ 覆蓋 '+ow+' 筆、新增 '+add+' 筆，共 '+existMap.size+' 筆';
  toast('✓ 覆蓋完成！'); debounceSave();
}

function exportDB(){
  var text=document.getElementById('db').value; if(!text){toast('母檔是空的');return;}
  var blob=new Blob([text],{type:'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='schDB_'+new Date().toISOString().slice(0,10)+'.txt';a.click();
}

function sortDayInput(){
  var ta=document.getElementById('inputA');
  var seen=new Map();
  ta.value.split('\n').map(function(l){return l.trim();}).filter(Boolean).forEach(function(line){
    var m=line.match(/^(\d+)\s*([^\s\d→➜\-]+)/);
    if(m) seen.set(m[2].trim(),{price:parseInt(m[1],10),line:line});
    else seen.set('__'+line,{price:-1,line:line});
  });
  ta.value=Array.from(seen.values()).sort(function(a,b){return b.price-a.price;}).map(function(x){return x.line;}).join('\n');
  saveLS('sch-input-day',ta.value); toast('✓ 已排序');
}

function convertDay(){
  var dbMap=parseToMap(document.getElementById('db').value.trim());
  var resultMap=new Map(), missing=[];
  document.getElementById('inputA').value.trim().split('\n').filter(Boolean).forEach(function(line){
    var m=line.match(/^(\d+)\s*([^\s\d→➜\-]+)\s*(\d{3,4}[^\d]+\d{3,4})/);
    if(!m) return;
    var price=parseInt(m[1],10),name=m[2].trim(),time=m[3].replace(/\s+/g,'');
    var entry=dbMap.get(name);
    if(entry){
      var text=entry.content;
      if(text.indexOf('🕒')!==-1) text=text.replace(/🕒[^\n]*/,'🕒'+time);
      else{var parts=text.split('\n'),idx=parts.findIndex(function(p){return p.indexOf('『'+name+'』')!==-1;});if(idx!==-1)parts.splice(idx+1,0,'🕒'+time);else parts.push('🕒'+time);text=parts.join('\n');}
      resultMap.set(name,{price:price,text:text});
    } else { if(missing.indexOf(name)===-1) missing.push(name); }
  });
  document.getElementById('outputDiv').textContent=Array.from(resultMap.values()).sort(function(a,b){return b.price-a.price;}).map(function(x){return x.text;}).join('\n\n')||'（格式不符或無資料）';
  document.getElementById('missing').textContent=missing.length?'⚠️ 找不到母檔：'+missing.join('、'):'';
}

function clearDayInput(){
  if(!confirm('確定清除？')) return;
  document.getElementById('inputA').value='';localStorage.removeItem('sch-input-day');
  document.getElementById('outputDiv').textContent='';document.getElementById('missing').textContent='';
}
function copyOutput(){
  var text=document.getElementById('outputDiv').textContent;
  if(!text||text.startsWith('（')){toast('尚無結果');return;}
  navigator.clipboard.writeText(text).then(function(){toast('✓ 已複製轉換結果');});
}

// 週報
var weekData={1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
var DAY_MAP={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'日':7};
var TO_CIRCLE={1:'㈠',2:'㈡',3:'㈢',4:'㈣',5:'㈤',6:'㈥',7:'㈦'};
var DAY_NAMES={1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'日'};
var CIRCLE_MAP={'㈠':'一','㈡':'二','㈢':'三','㈣':'四','㈤':'五','㈥':'六','①':'一','②':'二','③':'三','④':'四','⑤':'五','⑥':'六','⑦':'七'};
function normCircle(s){for(var k in CIRCLE_MAP)s=s.split(k).join('('+CIRCLE_MAP[k]+')');return s;}

function sortWeekInput(){
  var ta=document.getElementById('weekInput'),lines=ta.value.split('\n').filter(function(l){return l.trim();});
  lines.sort(function(a,b){var ma=a.match(/^\d+/),mb=b.match(/^\d+/);return(mb?parseInt(mb[0]):0)-(ma?parseInt(ma[0]):0);});
  ta.value=lines.join('\n');saveLS('sch-input-week',ta.value);
}

function convertWeek(){
  var rawInput=document.getElementById('weekInput').value.trim(); if(!rawInput){toast('請先輸入週報內容');return;}
  var raw=normCircle(rawInput);
  weekData={1:[],2:[],3:[],4:[],5:[],6:[],7:[]};var pureList=[];
  raw.split('\n').map(function(l){return l.trim();}).filter(function(l){return l&&!/^[⏔➜→✦꒰꒱\s\-=*]+$/.test(l)&&/^\d/.test(l);}).forEach(function(line){
    var mm=line.match(/^(\d+)\s*([^\s\d→➜\(\)]+)\s*[→➜]?\s*/); if(!mm) return;
    var price=parseInt(mm[1],10),name=mm[2].trim(),sched=line.substring(mm[0].length).trim(),active=new Set();
    if(sched){
      var re=/((?:\([一二三四五六七日]\))+)([^(]*)/g,m2;
      while((m2=re.exec(sched))!==null){
        var chars=m2[1].match(/[一二三四五六七日]/g)||[],t=m2[2].trim().replace(/\s+/g,'')||'未定';
        chars.forEach(function(ch){var dn=DAY_MAP[ch];if(dn){weekData[dn].push({price:price,name:name,time:t});active.add(dn);}});
      }
      if(!active.size)(sched.match(/\([一二三四五六七日]\)/g)||[]).forEach(function(d){var ch=d.replace(/[()]/g,''),dn=DAY_MAP[ch];if(dn){weekData[dn].push({price:price,name:name,time:'未定'});active.add(dn);}});
    }
    var days=Array.from(active).sort(function(a,b){return a-b;});
    pureList.push({price:price,text:price+name+(days.length?'➜'+days.map(function(n){return TO_CIRCLE[n];}).join(''):'（待定）')});
  });
  pureList.sort(function(a,b){return b.price-a.price;});
  document.getElementById('pureOutput').textContent=pureList.map(function(x){return x.text;}).join('\n')||'（無有效資料）';
  for(var i=1;i<=7;i++) weekData[i].sort(function(a,b){return b.price-a.price;});
  renderWeekGrid(); toast('✓ 週報彙整完成');
}

function clearWeekInput(){
  if(!confirm('確定清除？')) return;
  document.getElementById('weekInput').value='';localStorage.removeItem('sch-input-week');document.getElementById('pureOutput').textContent='';
}
function copyPure(){
  var text=document.getElementById('pureOutput').textContent;
  if(!text||text.startsWith('（')){toast('尚無內容');return;}
  navigator.clipboard.writeText(text).then(function(){toast('✓ 已複製乾淨名單');});
}
function renderWeekGrid(){
  var c=document.getElementById('weekGrid'); var html='';
  for(var i=1;i<=7;i++){
    var list=weekData[i];
    var items=list.length?list.map(function(x){return '<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;"><span>'+x.price+' '+x.name+'</span><span style="color:var(--text3);">'+x.time+'</span></div>';}).join(''):'<div style="color:var(--text3);font-size:11px;text-align:center;padding:6px 0;">無</div>';
    html+='<div style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;">'
      +'<div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;display:flex;justify-content:space-between;"><span>週'+DAY_NAMES[i]+'</span><span style="color:var(--text3);">'+list.length+'筆</span></div>'
      +items+'<button onclick="copySingleDay('+i+')" style="width:100%;margin-top:5px;padding:2px;font-size:10px;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text3);cursor:pointer;">📋</button></div>';
  }
  c.innerHTML=html;
}
function copySingleDay(d){
  var list=weekData[d]; if(!list||!list.length){toast('當天沒有資料');return;}
  navigator.clipboard.writeText(list.map(function(x){return x.price+x.name+(x.time&&x.time!=='未定'?' '+x.time:'');}).join('\n')).then(function(){toast('✓ 已複製週'+DAY_NAMES[d]);});
}

// ==================== 轉檔器 ==================
var FMT_DEFAULTS=[
  {name:"款式 A",symTitle:"✦ {DATE} 當日名單 ✦",symDot:"▫️ ",symMid:"．",symJp:"═══【 🇯🇵 日韓 】═══",symTw:"═══【 🇹🇼 本地 】═══",timePrefix:"[ ",timeSuffix:" ]",symGroupSep:"· · · · ·",symStatusLine:"════꒰ 💡 異動 ꒱════",symComing:"✦── 即將登場 ──✦"},
  {name:"款式 B",symTitle:"🌸 {DATE} 在席名單 🌸",symDot:"◦ ",symMid:"·",symJp:"〔 🇯🇵 日韓系 〕",symTw:"〔 🇹🇼 本地系 〕",timePrefix:"⏰",timeSuffix:"",symGroupSep:"- - - - -",symStatusLine:"──── 💬 異動通知 ────",symComing:"🌟 即將登場 🌟"},
  {name:"款式 C",symTitle:"📋 {DATE} 當日出席表",symDot:"• ",symMid:"｜",symJp:"— 日韓 —",symTw:"— 本地 —",timePrefix:"",timeSuffix:" 到",symGroupSep:"──────",symStatusLine:"· · · 異動 · · ·",symComing:"＊ 即將登場 ＊"},
  {name:"款式 D",symTitle:"💎 {DATE} 名單 💎",symDot:"❖ ",symMid:"✦",symJp:"【 日韓精選 】",symTw:"【 本地精選 】",timePrefix:"（",timeSuffix:"）",symGroupSep:"∙ ∙ ∙ ∙ ∙",symStatusLine:"══ ✧ 異動資訊 ✧ ══",symComing:"✨ 即將登場 ✨"}
];
var FMT_FIELDS=['symTitle','symDot','symMid','symJp','symTw','timePrefix','timeSuffix','symGroupSep','symStatusLine','symComing'];
var FMT_LABELS={symTitle:'標題格式',symDot:'項目符號',symMid:'中間符號',symJp:'日韓標題',symTw:'本地標題',timePrefix:'時間前綴',timeSuffix:'時間後綴',symGroupSep:'分隔線',symStatusLine:'異動標題',symComing:'登場標題'};
var FMT_WEEKDAYS=['日','一','二','三','四','五','六'];
var fmtPresets=JSON.parse(JSON.stringify(FMT_DEFAULTS));
var fmtCurrentPreset=0,fmtAdvOpen=false;

function fmtInit(){
  var saved=loadLS('fmt-presets');
  if(saved){try{var p=JSON.parse(saved);if(p.length===4)fmtPresets=p;}catch(e){}}
  fmtRefreshTabs();
  var t=new Date(),dp=document.getElementById('fmtDatePicker');
  if(dp&&!dp.value) dp.value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  fmtUpdateWeekday(t);
  var qr=loadLS('fmt-quickRest');if(qr&&document.getElementById('fmtQuickRest'))document.getElementById('fmtQuickRest').value=qr;
  var qf=loadLS('fmt-quickFull');if(qf&&document.getElementById('fmtQuickFull'))document.getElementById('fmtQuickFull').value=qf;
}
function fmtRefreshTabs(){
  var row=document.getElementById('fmtTabRow'); if(!row) return;
  row.innerHTML=fmtPresets.map(function(p,i){return '<button class="fmt-tab'+(i===fmtCurrentPreset?' active':'')+'" onclick="fmtSwitchPreset('+i+')">'+p.name+'</button>';}).join('');
  var nm=document.getElementById('fmtTabNameCur');if(nm)nm.value=fmtPresets[fmtCurrentPreset].name;
}
function fmtOnDateChange(){var v=document.getElementById('fmtDatePicker').value;if(v)fmtUpdateWeekday(new Date(v+'T00:00:00'));}
function fmtUpdateWeekday(d){var el=document.getElementById('fmtWeekday');if(el)el.textContent='（'+FMT_WEEKDAYS[d.getDay()]+'）';}
function fmtGetDateStr(){var v=document.getElementById('fmtDatePicker').value;if(!v)return '';var d=new Date(v+'T00:00:00');return(d.getMonth()+1)+'/'+d.getDate()+' ('+FMT_WEEKDAYS[d.getDay()]+')';}
function fmtToggleAdv(){fmtAdvOpen=!fmtAdvOpen;document.getElementById('fmtAdvBody').classList.toggle('open',fmtAdvOpen);document.getElementById('fmtAdvArrow').textContent=fmtAdvOpen?'▼':'▶';if(fmtAdvOpen)fmtRenderFieldGrid();}
function fmtRenderFieldGrid(){
  var grid=document.getElementById('fmtFieldGrid'),p=fmtPresets[fmtCurrentPreset];if(!grid)return;
  grid.innerHTML=FMT_FIELDS.map(function(k){return '<div class="field-item"><label>'+FMT_LABELS[k]+'</label><input type="text" value="'+(p[k]||'').replace(/"/g,'&quot;')+'" oninput="fmtPresets[fmtCurrentPreset][\''+k+'\']=this.value;"></div>';}).join('');
}
function fmtSwitchPreset(idx){fmtCurrentPreset=idx;fmtRefreshTabs();if(fmtAdvOpen)fmtRenderFieldGrid();}
function fmtSavePresets(){
  var nm=document.getElementById('fmtTabNameCur');if(nm)fmtPresets[fmtCurrentPreset].name=nm.value;
  saveLS('fmt-presets',JSON.stringify(fmtPresets));
  saveLS('fmt-quickRest',(document.getElementById('fmtQuickRest')||{}).value||'');
  saveLS('fmt-quickFull',(document.getElementById('fmtQuickFull')||{}).value||'');
  debounceSave(); toast('✓ 設定已儲存');
}
function fmtResetAll(){if(!confirm('確定還原?'))return;fmtPresets=JSON.parse(JSON.stringify(FMT_DEFAULTS));fmtRefreshTabs();if(fmtAdvOpen)fmtRenderFieldGrid();toast('↺ 已還原預設');}
function fmtParseInput(input){
  var lines=input.split('\n'),region='',comingGirls=[],jpHkGirls=[],taiwanGirls=[],cur=null;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    if(line.replace(/\s+/g,'').indexOf('即將登場')>=0){region='coming';continue;}
    if(line.replace(/\s+/g,'').indexOf('日韓推薦')>=0){region='jphk';continue;}
    if(line.replace(/\s+/g,'').indexOf('台妹推薦')>=0){region='taiwan';continue;}
    if(line.indexOf('本週預報')>=0||line.indexOf('注意事項')>=0){region='end';continue;}
    var m=line.match(/🤍\s*(\d+)\s*『([^』]+)』/);
    if(m){cur={age:m[1],name:m[2],time:'1300'};for(var j=i+1;j<Math.min(i+15,lines.length);j++){var nl=lines[j].trim();if(nl.indexOf('🤍')>=0||nl.indexOf('✤')>=0||nl.indexOf('━━')>=0)break;if(nl.indexOf('🕒')>=0){if(region==='coming')comingGirls.push({age:cur.age,name:cur.name,detail:nl.replace('🕒','').replace('➜',' ').trim()});else{var tm=nl.match(/🕒\s*(\d{4})/);if(tm)cur.time=tm[1];}break;}}if(region==='jphk')jpHkGirls.push(cur);if(region==='taiwan')taiwanGirls.push(cur);}
  }
  return {comingGirls:comingGirls,jpHkGirls:jpHkGirls,taiwanGirls:taiwanGirls};
}
function fmtBuildOutput(p,data,dateStr,txtRest,txtFull){
  var mid=p.symMid?' '+p.symMid+' ':' ',sep=p.symGroupSep||'';
  var r=p.symTitle.replace('{DATE}',dateStr)+'\n\n'+p.symJp+'\n';
  data.jpHkGirls.forEach(function(g){r+=p.symDot+g.age+' '+g.name+mid+p.timePrefix+g.time+p.timeSuffix+'\n';});
  if(!data.jpHkGirls.length)r+='｜無｜\n';
  r+='\n'+p.symTw+'\n';
  var tw=data.taiwanGirls,t1=tw.filter(function(g){return parseInt(g.age)>25;}),t2=tw.filter(function(g){return parseInt(g.age)>=21&&parseInt(g.age)<=25;}),t3=tw.filter(function(g){return parseInt(g.age)>=18&&parseInt(g.age)<=20;}),t4=tw.filter(function(g){return parseInt(g.age)<18;});
  var has=false,og=function(arr){arr.forEach(function(g){r+=p.symDot+g.age+' '+g.name+mid+p.timePrefix+g.time+p.timeSuffix+'\n';});};
  if(t1.length){og(t1);has=true;}if(t2.length){if(has&&sep)r+=sep+'\n';og(t2);has=true;}if(t3.length){if(has&&sep)r+=sep+'\n';og(t3);has=true;}if(t4.length){if(has&&sep)r+=sep+'\n';og(t4);}
  if(!tw.length)r+='｜無｜\n';r+='\n';
  if(p.symStatusLine.trim())r+=p.symStatusLine+'\n';if(txtRest.trim())r+=txtRest+'\n\n';if(txtFull.trim())r+=txtFull+'\n';
  if(data.comingGirls.length){r+='\n'+p.symComing+'\n';data.comingGirls.forEach(function(g){r+=g.age+' '+g.name+'\n'+g.detail+'\n';});}
  return r;
}
function fmtProcessAll(){
  var input=document.getElementById('fmtInputText').value;if(!input.trim()){toast('請先貼上文案');return;}
  var dateStr=fmtGetDateStr(),txtRest=(document.getElementById('fmtQuickRest')||{}).value||'',txtFull=(document.getElementById('fmtQuickFull')||{}).value||'';
  var data=fmtParseInput(input),area=document.getElementById('fmtOutputArea'),html='';
  for(var i=0;i<4;i++){
    var out=fmtBuildOutput(fmtPresets[i],data,dateStr,txtRest,txtFull);
    html+='<div style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
      +'<span style="font-size:12px;font-weight:600;color:var(--text2);">'+fmtPresets[i].name+'</span>'
      +'<button class="btn-outline btn-sm" onclick="fmtCopyIdx('+i+')">📋 複製</button></div>'
      +'<textarea rows="10" id="fmtOut_'+i+'" style="font-size:11px;" readonly>'+out+'</textarea></div>';
  }
  area.innerHTML=html; toast('✦ 四款轉檔完成');
}
function fmtCopyIdx(i){var ta=document.getElementById('fmtOut_'+i);if(!ta||!ta.value.trim()){toast('請先轉檔');return;}ta.select();document.execCommand('copy');toast('✅ 已複製「'+fmtPresets[i].name+'」');}

  try{setTheme(localStorage.getItem('ddb-admin-theme')||'default');}catch(e){}
  loadAdminFromCloud();
};
