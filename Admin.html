<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDB 後台管理</title>
<style>
:root{
  --bg:#F8F6F3;--card:#FFFFFF;--card2:#F2EDE8;--border:#E8E0D8;--border2:#D8CEC4;
  --text:#3A3330;--text2:#7A6E68;--text3:#A89890;--rose:#d4788a;--rose-light:#fce8ec;
  --sage:#6a9478;--sage-light:#e0f0e8;--sky:#6a8ea8;--sky-light:#daeef8;
  --peach:#d8906a;--peach-light:#f5ebe0;--gold:#b89470;--gold-light:#f5ede0;
  --accent:#b89470;--font:'Helvetica Neue',Arial,sans-serif;
}
body.dark-theme{
  --bg:#26221f;--card:#312c28;--card2:#3a342f;--border:#4a433d;--border2:#5c544c;
  --text:#f2ebe1;--text2:#bfb2a3;--text3:#8c8175;--rose:#e6b3ba;--rose-light:#453235;
  --sage:#a1c2a8;--sage-light:#304035;--sky:#a1b8d6;--sky-light:#2c384a;
  --peach:#e8bd9b;--peach-light:#4a382b;--gold:#d4b882;--gold-light:#423826;
  --accent:#d4b882;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;}
.app{max-width:960px;margin:0 auto;padding:16px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;}
.top-bar-title{font-size:15px;font-weight:700;letter-spacing:.05em;color:var(--gold);}
.top-bar-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text2);font-size:13px;cursor:pointer;transition:.18s;}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;letter-spacing:.04em;}
textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;color:var(--text);font-family:monospace;resize:vertical;outline:none;}
textarea:focus{border-color:var(--gold);}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-family:var(--font);transition:.18s;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{opacity:.9;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-rose{background:var(--rose);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.status-bar{font-size:11px;color:var(--text3);margin-top:8px;}
.theme-row{display:flex;gap:6px;}
.theme-row button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;}
.theme-row button.active{border-color:var(--gold);}
/* Format presets */
.fmt-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;}
.fmt-tab{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card2);color:var(--text2);font-size:12px;cursor:pointer;}
.fmt-tab.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.field-item label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px;}
.field-item input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--text);font-family:monospace;outline:none;}
.field-item input:focus{border-color:var(--gold);}
.adv-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text3);padding:6px 0;user-select:none;}
.adv-body{display:none;}
.adv-body.open{display:block;}
.output-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.output-row,.field-grid{grid-template-columns:1fr;}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#syncBadge{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--sage-light);color:var(--sage);border:1px solid var(--sage);}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div>
      <div class="top-bar-title">✦ DDB | 後台管理</div>
      <div class="top-bar-sub">班表母檔 · 轉檔器設定</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="syncBadge">同步中…</span>
      <div class="theme-row" id="themeToggle">
        <button onclick="setTheme('default')" class="active" title="預設">🌞</button>
        <button onclick="setTheme('dark-theme')" title="深色">🌙</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="AT('sched')">📅 班表母檔</button>
    <button class="tab-btn" onclick="AT('format')">✨ 轉檔器設定</button>
  </div>

  <!-- 班表母檔 -->
  <div id="panel-sched" class="panel active">
    <div class="card">
      <div class="card-title">母檔資料庫（格式：🤍牌價 『姓名』）</div>
      <textarea id="db" rows="20" placeholder="貼上母檔資料庫…" oninput="debounceSave()"></textarea>
      <div class="row" style="margin-top:10px;">
        <button class="btn-gold" onclick="sortDB()">↕ 排序去重</button>
        <button class="btn-outline" onclick="openPatchModal()">🔄 覆蓋更新</button>
        <button class="btn-outline btn-sm" onclick="exportDB()">💾 匯出</button>
      </div>
      <div id="dbStatus" class="status-bar"></div>
    </div>

    <div class="card">
      <div class="card-title">當日轉換（輸入牌價+姓名+時間）</div>
      <textarea id="inputA" rows="6" placeholder="格式：2000 姓名 1300-1700" oninput="saveLS('sch-input-day',this.value)"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn-gold" onclick="convertDay()">▶ 轉換</button>
        <button class="btn-outline btn-sm" onclick="sortDayInput()">↕ 排序</button>
        <button class="btn-outline btn-sm" onclick="clearDayInput()">✕ 清除</button>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:12px;color:var(--text3);">轉換結果</span>
        <button class="btn-outline btn-sm" onclick="copyOutput()">📋 複製</button>
      </div>
      <div id="outputDiv" style="margin-top:6px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:monospace;white-space:pre-wrap;min-height:60px;max-height:300px;overflow-y:auto;color:var(--text);"></div>
      <div id="missing" class="status-bar" style="color:var(--rose);"></div>
    </div>

    <div class="card">
      <div class="card-title">週報彙整</div>
      <textarea id="weekInput" rows="8" placeholder="貼上週報原文…" oninput="saveLS('sch-input-week',this.value)"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn-gold" onclick="convertWeek()">▶ 彙整</button>
        <button class="btn-outline btn-sm" onclick="sortWeekInput()">↕ 排序</button>
        <button class="btn-outline btn-sm" onclick="clearWeekInput()">✕ 清除</button>
        <button class="btn-outline btn-sm" onclick="copyPure()">📋 複製乾淨名單</button>
      </div>
      <div id="pureOutput" style="margin-top:10px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:monospace;white-space:pre-wrap;min-height:40px;max-height:180px;overflow-y:auto;color:var(--text);"></div>
      <div id="weekGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;"></div>
    </div>
  </div>

  <!-- 轉檔器設定 -->
  <div id="panel-format" class="panel">
    <div class="card">
      <div class="card-title">轉檔器</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
        <input type="date" id="fmtDatePicker" style="background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:13px;" onchange="fmtOnDateChange()">
        <span id="fmtWeekday" style="color:var(--text3);font-size:13px;"></span>
      </div>
      <textarea id="fmtInputText" rows="8" placeholder="貼上原始名單文案…"></textarea>
      <div style="margin-top:10px;">
        <div class="card-title">快速異動文字</div>
        <textarea id="fmtQuickRest" rows="2" placeholder="休息異動文字…" style="margin-bottom:6px;" oninput="saveLS('fmt-quickRest',this.value)"></textarea>
        <textarea id="fmtQuickFull" rows="2" placeholder="完整異動文字…" oninput="saveLS('fmt-quickFull',this.value)"></textarea>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn-gold" onclick="fmtProcessAll()">✦ 四款轉檔</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">款式設定</div>
      <div class="fmt-tabs" id="fmtTabRow"></div>
      <div style="margin-bottom:10px;">
        <label style="font-size:11px;color:var(--text3);">款式名稱</label>
        <input type="text" id="fmtTabNameCur" style="width:160px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--text);" oninput="fmtPresets[fmtCurrentPreset].name=this.value;fmtRefreshTabs();">
      </div>
      <div class="adv-toggle" onclick="fmtToggleAdv()">
        <span id="fmtAdvArrow">▶</span> 進階符號設定
      </div>
      <div class="adv-body" id="fmtAdvBody">
        <div class="field-grid" style="margin-top:8px;" id="fmtFieldGrid"></div>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn-gold" onclick="fmtSavePresets()">💾 儲存設定</button>
        <button class="btn-outline btn-sm" onclick="fmtResetAll()">↺ 還原預設</button>
      </div>
    </div>

    <div class="output-row" id="fmtOutputArea"></div>
  </div>
</div>

<!-- Patch Modal -->
<div id="patchModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;align-items:center;justify-content:center;" onclick="if(event.target===this)closePatchModal()">
  <div style="background:var(--card);border-radius:12px;padding:20px;width:min(480px,90vw);">
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">🔄 覆蓋更新</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">貼入要新增或覆蓋的人員資料。</div>
    <textarea id="dbPatch" rows="8" placeholder="貼入資料…"></textarea>
    <div id="patchResult" style="font-size:12px;color:var(--rose);margin-top:6px;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button class="btn-outline" onclick="closePatchModal()">取消</button>
      <button class="btn-gold" onclick="patchDB()">✓ 確定覆蓋</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ==================== 主題 ====================
function setTheme(t){
  document.body.classList.remove('dark-theme');
  if(t!=='default') document.body.classList.add(t);
  localStorage.setItem('ddb-admin-theme',t);
  document.querySelectorAll('#themeToggle button').forEach(function(b,i){
    b.classList.toggle('active',(['default','dark-theme'][i])===t);
  });
}
(function(){
  var t=localStorage.getItem('ddb-admin-theme')||'default';
  setTheme(t);
})();

// ==================== Tab 切換 ====================
function AT(id){
  ['sched','format'].forEach(function(t,i){
    document.getElementById('panel-'+t).classList.toggle('active',t===id);
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active',t===id);
  });
  if(id==='format') fmtInit();
}

// ==================== Toast ====================
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='show';
  setTimeout(function(){el.className='';},2400);
}

// ==================== localStorage ====================
function loadLS(k){ try{return localStorage.getItem(k)||'';}catch(e){return '';} }
function saveLS(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

// ==================== Cloud Sync ====================
var syncTimer=null;
function debounceSave(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(saveAdminToCloud,1200);
}

function setSyncBadge(s,msg){
  var el=document.getElementById('syncBadge');
  if(!el) return;
  el.textContent=msg;
  el.style.background=s==='ok'?'var(--sage-light)':s==='err'?'var(--rose-light)':'var(--gold-light)';
  el.style.color=s==='ok'?'var(--sage)':s==='err'?'var(--rose)':'var(--gold)';
  el.style.borderColor=s==='ok'?'var(--sage)':s==='err'?'var(--rose)':'var(--gold)';
}

function saveAdminToCloud(){
  if(typeof google==='undefined'||!google.script||!google.script.run) return;
  setSyncBadge('syncing','儲存中…');
  var payload={
    schDB: document.getElementById('db').value||'',
    formatPresets: JSON.parse(JSON.stringify(fmtPresets||[]))
  };
  google.script.run
    .withSuccessHandler(function(r){ setSyncBadge(r.success?'ok':'err', r.success?'已同步':'儲存失敗'); })
    .withFailureHandler(function(){ setSyncBadge('err','儲存失敗'); })
    .saveAdminData(payload);
}

function loadAdminFromCloud(){
  if(typeof google==='undefined'||!google.script||!google.script.run){
    setSyncBadge('ok','本機模式');
    restoreLocalState();
    return;
  }
  setSyncBadge('syncing','載入中…');
  google.script.run
    .withSuccessHandler(function(r){
      if(r.schDB) document.getElementById('db').value=r.schDB;
      if(r.formatPresets&&r.formatPresets.length) fmtPresets=r.formatPresets;
      setSyncBadge('ok','已同步');
      restoreLocalState();
    })
    .withFailureHandler(function(){
      setSyncBadge('err','載入失敗');
      restoreLocalState();
    })
    .loadAdminData();
}

function restoreLocalState(){
  var day=loadLS('sch-input-day'); if(day&&document.getElementById('inputA')) document.getElementById('inputA').value=day;
  var week=loadLS('sch-input-week'); if(week&&document.getElementById('weekInput')) document.getElementById('weekInput').value=week;
  var qr=loadLS('fmt-quickRest'); if(qr&&document.getElementById('fmtQuickRest')) document.getElementById('fmtQuickRest').value=qr;
  var qf=loadLS('fmt-quickFull'); if(qf&&document.getElementById('fmtQuickFull')) document.getElementById('fmtQuickFull').value=qf;
}

// ==================== 班表母檔 ====================
function parseToMap(raw){
  var map=new Map();
  if(!raw) return map;
  raw.split(/\n\s*\n/).forEach(function(block){
    var b=block.trim(); if(!b) return;
    var nm=b.match(/『([^』]+)』/);
    var pm=b.match(/🤍(\d+)/);
    if(nm&&pm) map.set(nm[1].trim(),{price:parseInt(pm[1],10),content:b});
  });
  return map;
}

function sortDB(){
  var raw=document.getElementById('db').value.trim();
  if(!raw){toast('資料庫是空的');return;}
  var arr=Array.from(parseToMap(raw).values()).sort(function(a,b){return b.price-a.price;});
  document.getElementById('db').value=arr.map(function(x){return x.content;}).join('\n\n');
  document.getElementById('dbStatus').textContent='✓ 去重 + 降序（共 '+arr.length+' 筆）';
  debounceSave();
}

function openPatchModal(){
  document.getElementById('dbPatch').value='';
  document.getElementById('patchResult').textContent='';
  document.getElementById('patchModal').style.display='flex';
}
function closePatchModal(){ document.getElementById('patchModal').style.display='none'; }

function patchDB(){
  var patchRaw=document.getElementById('dbPatch').value.trim();
  if(!patchRaw){document.getElementById('patchResult').textContent='⚠️ 請先貼入資料';return;}
  var existMap=parseToMap(document.getElementById('db').value.trim());
  var patchMap=parseToMap(patchRaw);
  if(patchMap.size===0){document.getElementById('patchResult').textContent='⚠️ 找不到有效格式';return;}
  var ow=0,add=0;
  patchMap.forEach(function(val,name){if(existMap.has(name))ow++;else add++;existMap.set(name,val);});
  var arr=Array.from(existMap.values()).sort(function(a,b){return b.price-a.price;});
  document.getElementById('db').value=arr.map(function(x){return x.content;}).join('\n\n');
  closePatchModal();
  document.getElementById('dbStatus').textContent='✓ 覆蓋 '+ow+' 筆、新增 '+add+' 筆，共 '+existMap.size+' 筆';
  toast('✓ 覆蓋完成！');
  debounceSave();
}

function exportDB(){
  var text=document.getElementById('db').value;
  if(!text){toast('母檔是空的');return;}
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='schDB_'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
}

function sortDayInput(){
  var ta=document.getElementById('inputA');
  var lines=ta.value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var seen=new Map();
  lines.forEach(function(line){
    var m=line.match(/^(\d+)\s*([^\s\d→➜\-]+)/);
    if(m) seen.set(m[2].trim(),{price:parseInt(m[1],10),line:line});
    else seen.set('__r__'+line,{price:-1,line:line});
  });
  ta.value=Array.from(seen.values()).sort(function(a,b){return b.price-a.price;}).map(function(x){return x.line;}).join('\n');
  saveLS('sch-input-day',ta.value);
  toast('✓ 已依牌價排序並去除重複');
}

function convertDay(){
  var dbMap=parseToMap(document.getElementById('db').value.trim());
  var lines=document.getElementById('inputA').value.trim().split('\n').filter(Boolean);
  var resultMap=new Map();
  var missing=[];
  lines.forEach(function(line){
    var m=line.match(/^(\d+)\s*([^\s\d→➜\-]+)\s*(\d{3,4}[^\d]+\d{3,4})/);
    if(!m) return;
    var price=parseInt(m[1],10),name=m[2].trim(),time=m[3].replace(/\s+/g,'');
    var entry=dbMap.get(name);
    if(entry){
      var text=entry.content;
      if(text.indexOf('🕒')!==-1) text=text.replace(/🕒[^\n]*/,'🕒'+time);
      else{
        var parts=text.split('\n');
        var idx=parts.findIndex(function(p){return p.indexOf('『'+name+'』')!==-1;});
        if(idx!==-1) parts.splice(idx+1,0,'🕒'+time); else parts.push('🕒'+time);
        text=parts.join('\n');
      }
      resultMap.set(name,{price:price,text:text});
    } else {
      if(missing.indexOf(name)===-1) missing.push(name);
    }
  });
  var sorted=Array.from(resultMap.values()).sort(function(a,b){return b.price-a.price;});
  document.getElementById('outputDiv').textContent=sorted.map(function(x){return x.text;}).join('\n\n')||'（格式不符或無資料）';
  document.getElementById('missing').textContent=missing.length?'⚠️ 找不到母檔：'+missing.join('、'):'';
}

function clearDayInput(){
  if(!confirm('確定清除？')) return;
  document.getElementById('inputA').value='';
  localStorage.removeItem('sch-input-day');
  document.getElementById('outputDiv').textContent='';
  document.getElementById('missing').textContent='';
}

function copyOutput(){
  var text=document.getElementById('outputDiv').textContent;
  if(!text||text.startsWith('（')){toast('尚無轉換結果');return;}
  navigator.clipboard.writeText(text).then(function(){toast('✓ 已複製轉換結果');});
}

// 週報
var weekData={1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
var DAY_MAP={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'日':7};
var TO_CIRCLE={1:'㈠',2:'㈡',3:'㈢',4:'㈣',5:'㈤',6:'㈥',7:'㈦'};
var DAY_NAMES={1:'週一',2:'週二',3:'週三',4:'週四',5:'週五',6:'週六',7:'週日'};
var CIRCLE_MAP={'㈠':'一','㈡':'二','㈢':'三','㈣':'四','㈤':'五','㈥':'六','①':'一','②':'二','③':'三','④':'四','⑤':'五','⑥':'六','⑦':'七'};

function normCircle(s){for(var k in CIRCLE_MAP)s=s.split(k).join('('+CIRCLE_MAP[k]+')');return s;}

function sortWeekInput(){
  var ta=document.getElementById('weekInput');
  var lines=ta.value.split('\n').filter(function(l){return l.trim();});
  lines.sort(function(a,b){
    var ma=a.match(/^\d+/),mb=b.match(/^\d+/);
    return (mb?parseInt(mb[0]):0)-(ma?parseInt(ma[0]):0);
  });
  ta.value=lines.join('\n');
  saveLS('sch-input-week',ta.value);
}

function convertWeek(){
  var rawInput=document.getElementById('weekInput').value.trim();
  if(!rawInput){toast('請先輸入週報內容');return;}
  var raw=normCircle(rawInput);
  weekData={1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
  var pureList=[];
  var lines=raw.split('\n').map(function(l){return l.trim();}).filter(function(l){
    if(!l) return false;
    if(/^[⏔➜→✦꒰꒱\s\-=*]+$/.test(l)) return false;
    return /^\d/.test(l);
  });
  lines.forEach(function(line){
    var mm=line.match(/^(\d+)\s*([^\s\d→➜\(\)]+)\s*[→➜]?\s*/);
    if(!mm) return;
    var price=parseInt(mm[1],10),name=mm[2].trim();
    var sched=line.substring(mm[0].length).trim();
    var active=new Set();
    if(sched){
      var re=/((?:\([一二三四五六七日]\))+)([^(]*)/g,m;
      while((m=re.exec(sched))!==null){
        var chars=m[1].match(/[一二三四五六七日]/g)||[];
        var t=m[2].trim().replace(/\s+/g,'')||'未定';
        chars.forEach(function(ch){var dn=DAY_MAP[ch];if(dn){weekData[dn].push({price:price,name:name,time:t});active.add(dn);}});
      }
      if(active.size===0){
        (sched.match(/\([一二三四五六七日]\)/g)||[]).forEach(function(d){
          var ch=d.replace(/[()]/g,''),dn=DAY_MAP[ch];
          if(dn){weekData[dn].push({price:price,name:name,time:'未定'});active.add(dn);}
        });
      }
    }
    var days=Array.from(active).sort(function(a,b){return a-b;});
    var circ=days.map(function(n){return TO_CIRCLE[n];}).join('');
    pureList.push({price:price,text:price+name+(circ?'➜'+circ:'（待定）')});
  });
  pureList.sort(function(a,b){return b.price-a.price;});
  document.getElementById('pureOutput').textContent=pureList.map(function(x){return x.text;}).join('\n')||'（無有效資料）';
  for(var i=1;i<=7;i++) weekData[i].sort(function(a,b){return b.price-a.price;});
  renderWeekGrid();
  toast('✓ 週報彙整完成');
}

function clearWeekInput(){
  if(!confirm('確定清除？')) return;
  document.getElementById('weekInput').value='';
  localStorage.removeItem('sch-input-week');
  document.getElementById('pureOutput').textContent='';
}

function copyPure(){
  var text=document.getElementById('pureOutput').textContent;
  if(!text||text.startsWith('（')){toast('尚無內容');return;}
  navigator.clipboard.writeText(text).then(function(){toast('✓ 已複製乾淨名單');});
}

function renderWeekGrid(){
  var c=document.getElementById('weekGrid');
  var html='';
  for(var i=1;i<=7;i++){
    var list=weekData[i];
    var items=list.length>0
      ?list.map(function(x){return '<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:11px;"><span>'+x.price+' '+x.name+'</span><span style="color:var(--text3);">'+x.time+'</span></div>';}).join('')
      :'<div style="color:var(--text3);font-size:11px;text-align:center;padding:8px 0;">暫無</div>';
    html+='<div style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px;"><div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between;"><span>'+DAY_NAMES[i]+'</span><span style="color:var(--text3);">'+list.length+'筆</span></div>'+items+'<button onclick="copySingleDay('+i+')" style="width:100%;margin-top:6px;padding:3px;font-size:10px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text3);cursor:pointer;">📋</button></div>';
  }
  c.innerHTML=html;
}

function copySingleDay(d){
  var list=weekData[d];
  if(!list||!list.length){toast('當天沒有資料');return;}
  list.sort(function(a,b){return b.price-a.price;});
  var text=list.map(function(x){return x.price+x.name+(x.time&&x.time!=='未定'?' '+x.time:'');}).join('\n');
  navigator.clipboard.writeText(text).then(function(){toast('✓ 已複製 '+DAY_NAMES[d]+' 班表');});
}

// ==================== 轉檔器 (fmt*) ====================
var FMT_DEFAULTS=[
  {name:"款式 A",symTitle:"✦ {DATE} 當日名單 ✦",symDot:"▫️ ",symMid:"．",symJp:"═══【 🇯🇵 日韓 】═══",symTw:"═══【 🇹🇼 本地 】═══",timePrefix:"[ ",timeSuffix:" ]",symGroupSep:"· · · · ·",symStatusLine:"════꒰ 💡 異動 ꒱════",symComing:"✦── 即將登場 ──✦"},
  {name:"款式 B",symTitle:"🌸 {DATE} 在席名單 🌸",symDot:"◦ ",symMid:"·",symJp:"〔 🇯🇵 日韓系 〕",symTw:"〔 🇹🇼 本地系 〕",timePrefix:"⏰",timeSuffix:"",symGroupSep:"- - - - -",symStatusLine:"──── 💬 異動通知 ────",symComing:"🌟 即將登場 🌟"},
  {name:"款式 C",symTitle:"📋 {DATE} 當日出席表",symDot:"• ",symMid:"｜",symJp:"— 日韓 —",symTw:"— 本地 —",timePrefix:"",timeSuffix:" 到",symGroupSep:"──────",symStatusLine:"· · · 異動 · · ·",symComing:"＊ 即將登場 ＊"},
  {name:"款式 D",symTitle:"💎 {DATE} 名單 💎",symDot:"❖ ",symMid:"✦",symJp:"【 日韓精選 】",symTw:"【 本地精選 】",timePrefix:"（",timeSuffix:"）",symGroupSep:"∙ ∙ ∙ ∙ ∙",symStatusLine:"══ ✧ 異動資訊 ✧ ══",symComing:"✨ 即將登場 ✨"}
];
var FMT_FIELDS=['symTitle','symDot','symMid','symJp','symTw','timePrefix','timeSuffix','symGroupSep','symStatusLine','symComing'];
var FMT_FIELD_LABELS={symTitle:'標題格式',symDot:'項目符號',symMid:'中間符號',symJp:'日韓標題',symTw:'本地標題',timePrefix:'時間前綴',timeSuffix:'時間後綴',symGroupSep:'分隔線',symStatusLine:'異動標題',symComing:'登場標題'};
var FMT_WEEKDAYS=['日','一','二','三','四','五','六'];
var fmtPresets=JSON.parse(JSON.stringify(FMT_DEFAULTS));
var fmtCurrentPreset=0;
var fmtAdvOpen=false;

function fmtInit(){
  var saved=loadLS('fmt-presets');
  if(saved){try{var p=JSON.parse(saved);if(p.length===4)fmtPresets=p;}catch(e){}}
  fmtRefreshTabs();
  fmtRenderPresetSettings();
  var t=new Date();
  var ds=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  var dp=document.getElementById('fmtDatePicker');
  if(dp&&!dp.value) dp.value=ds;
  fmtUpdateWeekday(t);
}

function fmtRefreshTabs(){
  var row=document.getElementById('fmtTabRow');
  if(!row) return;
  row.innerHTML=fmtPresets.map(function(p,i){
    return '<button class="fmt-tab'+(i===fmtCurrentPreset?' active':'')+'" onclick="fmtSwitchPreset('+i+')">'+p.name+'</button>';
  }).join('');
  var nm=document.getElementById('fmtTabNameCur');
  if(nm) nm.value=fmtPresets[fmtCurrentPreset].name;
}

function fmtOnDateChange(){
  var val=document.getElementById('fmtDatePicker').value;
  if(!val) return;
  fmtUpdateWeekday(new Date(val+'T00:00:00'));
}

function fmtUpdateWeekday(d){
  var el=document.getElementById('fmtWeekday');
  if(el) el.textContent='（'+FMT_WEEKDAYS[d.getDay()]+'）';
}

function fmtGetDateStr(){
  var val=document.getElementById('fmtDatePicker').value;
  if(!val) return '';
  var d=new Date(val+'T00:00:00');
  return (d.getMonth()+1)+'/'+d.getDate()+' ('+FMT_WEEKDAYS[d.getDay()]+')';
}

function fmtToggleAdv(){
  fmtAdvOpen=!fmtAdvOpen;
  document.getElementById('fmtAdvBody').classList.toggle('open',fmtAdvOpen);
  document.getElementById('fmtAdvArrow').textContent=fmtAdvOpen?'▼':'▶';
  if(fmtAdvOpen) fmtRenderFieldGrid();
}

function fmtRenderFieldGrid(){
  var grid=document.getElementById('fmtFieldGrid');
  if(!grid) return;
  var p=fmtPresets[fmtCurrentPreset];
  grid.innerHTML=FMT_FIELDS.map(function(k){
    return '<div class="field-item"><label>'+FMT_FIELD_LABELS[k]+'</label><input type="text" id="fmtF_'+k+'" value="'+(p[k]||'').replace(/"/g,'&quot;')+'" oninput="fmtPresets[fmtCurrentPreset][\''+k+'\']=this.value;"></div>';
  }).join('');
}

function fmtRenderPresetSettings(){
  fmtRenderFieldGrid();
  var nm=document.getElementById('fmtTabNameCur');
  if(nm) nm.value=fmtPresets[fmtCurrentPreset].name;
}

function fmtSwitchPreset(idx){
  fmtCurrentPreset=idx;
  fmtRefreshTabs();
  fmtRenderPresetSettings();
}

function fmtSavePresets(){
  var nm=document.getElementById('fmtTabNameCur');
  if(nm) fmtPresets[fmtCurrentPreset].name=nm.value;
  saveLS('fmt-presets',JSON.stringify(fmtPresets));
  var qr=document.getElementById('fmtQuickRest'); if(qr) saveLS('fmt-quickRest',qr.value);
  var qf=document.getElementById('fmtQuickFull'); if(qf) saveLS('fmt-quickFull',qf.value);
  debounceSave();
  toast('✓ 設定已儲存');
}

function fmtResetAll(){
  if(!confirm('確定要恢復所有預設值嗎？')) return;
  fmtPresets=JSON.parse(JSON.stringify(FMT_DEFAULTS));
  fmtRefreshTabs(); fmtRenderPresetSettings();
  toast('↺ 已恢復預設值');
}

function fmtParseInput(input){
  var lines=input.split('\n');
  var region='',comingGirls=[],jpHkGirls=[],taiwanGirls=[],currentGirl=null;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(); if(!line) continue;
    if(line.replace(/\s+/g,'').indexOf('即將登場')>=0){region='coming';continue;}
    if(line.replace(/\s+/g,'').indexOf('日韓推薦')>=0){region='jphk';continue;}
    if(line.replace(/\s+/g,'').indexOf('台妹推薦')>=0){region='taiwan';continue;}
    if(line.indexOf('本週預報')>=0||line.indexOf('注意事項')>=0){region='end';continue;}
    var m=line.match(/🤍\s*(\d+)\s*『([^』]+)』/);
    if(m){
      currentGirl={age:m[1],name:m[2],time:'1300'};
      for(var j=i+1;j<Math.min(i+15,lines.length);j++){
        var nl=lines[j].trim();
        if(nl.indexOf('🤍')>=0||nl.indexOf('✤')>=0||nl.indexOf('━━')>=0) break;
        if(nl.indexOf('🕒')>=0){
          if(region==='coming') comingGirls.push({age:currentGirl.age,name:currentGirl.name,detail:nl.replace('🕒','').replace('➜',' ').trim()});
          else{var tm=nl.match(/🕒\s*(\d{4})/);if(tm)currentGirl.time=tm[1];}
          break;
        }
      }
      if(region==='jphk') jpHkGirls.push(currentGirl);
      if(region==='taiwan') taiwanGirls.push(currentGirl);
    }
  }
  return {comingGirls:comingGirls,jpHkGirls:jpHkGirls,taiwanGirls:taiwanGirls};
}

function fmtBuildOutput(p,data,dateStr,txtRest,txtFull){
  var comingGirls=data.comingGirls,jpHkGirls=data.jpHkGirls,taiwanGirls=data.taiwanGirls;
  var mid=p.symMid?' '+p.symMid+' ':' ';
  var sep=p.symGroupSep||'';
  var title=p.symTitle.replace('{DATE}',dateStr);
  var r=title+'\n\n'+p.symJp+'\n';
  jpHkGirls.forEach(function(g){r+=p.symDot+g.age+' '+g.name+mid+p.timePrefix+g.time+p.timeSuffix+'\n';});
  if(!jpHkGirls.length) r+='｜無｜\n';
  r+='\n'+p.symTw+'\n';
  var t1=taiwanGirls.filter(function(g){return parseInt(g.age)>25;});
  var t2=taiwanGirls.filter(function(g){return parseInt(g.age)>=21&&parseInt(g.age)<=25;});
  var t3=taiwanGirls.filter(function(g){return parseInt(g.age)>=18&&parseInt(g.age)<=20;});
  var t4=taiwanGirls.filter(function(g){return parseInt(g.age)<18;});
  var has=false;
  var og=function(arr){arr.forEach(function(g){r+=p.symDot+g.age+' '+g.name+mid+p.timePrefix+g.time+p.timeSuffix+'\n';});};
  if(t1.length){og(t1);has=true;}
  if(t2.length){if(has&&sep)r+=sep+'\n';og(t2);has=true;}
  if(t3.length){if(has&&sep)r+=sep+'\n';og(t3);has=true;}
  if(t4.length){if(has&&sep)r+=sep+'\n';og(t4);}
  if(!taiwanGirls.length) r+='｜無｜\n';
  r+='\n';
  if(p.symStatusLine.trim()) r+=p.symStatusLine+'\n';
  if(txtRest.trim()) r+=txtRest+'\n\n';
  if(txtFull.trim()) r+=txtFull+'\n';
  if(comingGirls.length){r+='\n'+p.symComing+'\n';comingGirls.forEach(function(g){r+=g.age+' '+g.name+'\n'+g.detail+'\n';});}
  return r;
}

function fmtProcessAll(){
  var input=document.getElementById('fmtInputText').value;
  if(!input.trim()){toast('請先貼上文案再點轉檔。');return;}
  var dateStr=fmtGetDateStr();
  var txtRest=(document.getElementById('fmtQuickRest')||{}).value||'';
  var txtFull=(document.getElementById('fmtQuickFull')||{}).value||'';
  var data=fmtParseInput(input);
  var area=document.getElementById('fmtOutputArea');
  var html='';
  for(var i=0;i<4;i++){
    var out=fmtBuildOutput(fmtPresets[i],data,dateStr,txtRest,txtFull);
    html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:12px;font-weight:600;color:var(--text2);">'+fmtPresets[i].name+'</span>'
      +'<button class="btn-outline btn-sm" onclick="fmtCopyIdx('+i+')">📋 複製</button></div>'
      +'<textarea rows="10" id="fmtOut_'+i+'" style="font-size:11px;" readonly>'+out+'</textarea></div>';
  }
  area.innerHTML=html;
  toast('✦ 四款轉檔完成');
}

function fmtCopyIdx(i){
  var ta=document.getElementById('fmtOut_'+i);
  if(!ta||!ta.value.trim()){toast('請先點擊轉檔。');return;}
  ta.select(); document.execCommand('copy');
  toast('✅ 已複製「'+fmtPresets[i].name+'」');
}
